name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test

    uses: ./.github/workflows/build.yml

    with:
      java-version: '21'
      java-distribution: 'temurin'
      artifact-name: 'rule-engine'

  distribution:
    name: Package distribution

    needs: build

    uses: ./.github/workflows/distribution.yml

    with:
      java-version: '21'
      java-distribution: 'temurin'
      artifact-name: 'rule-engine'

  release:
    name: Publish GitHub release
    needs: distribution

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    uses: ./.github/workflows/release.yml

    with:
      artifact-name: 'rule-engine'

  docker:
    name: Docker image
    needs: build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
